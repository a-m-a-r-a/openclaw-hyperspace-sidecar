name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s python -p 'test_*.py'
      - run: npx --no-install openclaw plugins build --root . --entry ./dist/index.js --check
      - run: npx --no-install openclaw plugins validate --root . --entry ./dist/index.js
